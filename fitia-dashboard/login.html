<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | FitIA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="logo.png" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col items-center justify-center min-h-screen px-4 py-8">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-200">
    
    <!-- Logo -->
    <div class="mb-4 text-center">
      <img 
        src="logo.png" 
        alt="Logo FitIA" 
        class="h-20 w-auto mx-auto rounded-lg shadow-md" 
        onerror="this.onerror=null;this.src='https://placehold.co/200x60/22C55E/FFFFFF?text=logo';"
      />
    </div>

    <p class="text-sm text-gray-500 mb-6 text-center">Sua inteligência fitness conectada</p>

    <form onsubmit="return validarLogin()">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
        <input type="email" id="email" class="w-full px-4 py-2 rounded-lg bg-gray-50 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 text-gray-800" placeholder="seu@email.com" required>
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" id="password" class="w-full px-4 py-2 rounded-lg bg-gray-50 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 text-gray-800" placeholder="••••••••" required>
      </div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition duration-200 ease-in-out shadow-md">Entrar</button>
    </form>

    <p class="text-sm text-center text-gray-500 mt-6">Esqueceu a senha? <a href="#" class="text-green-600 hover:underline">Recuperar</a></p>
  </div>

  <!-- Script de validação -->
  <script>
    function validarLogin() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('password').value.trim();

      if (email === 'isabela@gmail.com' && senha === '12345') {
        // Redireciona para dashboard.html
        window.location.href = "dashboard.html";
      } else {
        alert('E-mail ou senha incorretos.');
      }

      return false; // Impede envio do formulário
    }
  </script>

</body>
</html>
